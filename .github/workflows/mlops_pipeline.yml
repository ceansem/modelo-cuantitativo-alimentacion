name: MLOps End-to-End Pipeline

on:
  push:
    branches:
      - '**' # Se ejecuta en cualquier rama

jobs:
  # ==========================================
  # FASE 1: TEST
  # ==========================================
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Pruebas unitarias
        run: pytest test/

  # ==========================================
  # FASE 2: TRAIN
  # ==========================================
  train:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Entrenar modelo
        run: |
          # 1. PARCHE: cambiamos 'xlp' por 'median'
          sed -i 's/BENCHMARK = "xlp"/BENCHMARK = "median"/g' src/train.py
          
          # 2. Aseguramos que Python encuentre la carpeta src/ y ejecutamos
          PYTHONPATH=. python src/train.py

      - name: Guardar Modelos, Scalers y Metadata como Artefactos
        uses: actions/upload-artifact@v4
        with:
          name: modelos-entrenados
          path: |
            models/**/*.pkl
            models/**/*.json
          retention-days: 7

  # ==========================================
  # FASE 3: DEPLOY (Desactivada temporalmente)
  # ==========================================
  deploy:
    needs: train
    runs-on: ubuntu-latest
    # Al poner 'false', GitHub Actions se saltará este paso automáticamente
    # Cuando tengas un servidor/storage, cámbialo a: if: github.ref == 'refs/heads/main'
    if: false 
    steps:
      - uses: actions/checkout@v4

      - name: Descargar modelos entrenados
        uses: actions/download-artifact@v4
        with:
          name: modelos-entrenados
          path: models/

      - name: Desplegar a Producción (Placeholder)
        run: |
          echo "Despliegue desactivado temporalmente."
          echo "A la espera de definir el destino de almacenamiento (S3, Hugging Face, BD, etc)."